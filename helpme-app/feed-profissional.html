<!--
  TELA: Feed de Oportunidades (feed-profissional.html)
  OBJETIVO: Lista de chamados abertos para o prestador de serviço.
  O QUE FAZER AQUI:
  - JS busca pedidos na tabela 'pedidos' onde status = 'aberto' e categoria é a do profissional.
  - Renderizar cards com endereço e problema.
  - Cada card deve ter o botão "Aceitar Serviço".
  - Importar no final: Supabase CDN, js/supabase-config.js e js/profissional.js.
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpMe - Oportunidades</title>

    <!-- Fontes (mesmas dos protótipos) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Conectando as folhas de estilo (CSS) -->
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body class="painel">

    <!-- Barra lateral de navegação -->
    <aside class="sidebar">
        <a href="feed-profissional.html" class="sidebar-logo">
            <span class="logo-icone">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
            </span>
            HelpMe
        </a>

        <nav class="sidebar-menu">
            <a href="feed-profissional.html" class="menu-item ativo">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                Oportunidades
            </a>
            <a href="servico-andamento.html" class="menu-item">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                Em andamento
            </a>
        </nav>

        <button type="button" id="btn-sair" class="menu-item menu-sair">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            Sair
        </button>
    </aside>

    <!-- Conteúdo principal -->
    <main class="conteudo">
        <header class="conteudo-cabecalho">
            <div>
                <h1>Oportunidades perto de você</h1>
                <p id="contador-pedidos" class="subtitulo">Buscando pedidos abertos...</p>
            </div>
            <button type="button" id="btn-atualizar" class="btn-secundario">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
                Atualizar
            </button>
        </header>

        <!-- Os cards de pedidos são inseridos aqui pelo js/profissional.js -->
        <section id="lista-pedidos" class="grade-pedidos" aria-live="polite"></section>

        <!-- Estado vazio (aparece quando não há pedidos abertos) -->
        <div id="feed-vazio" class="feed-vazio" hidden>
            <div class="feed-vazio-icone">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            </div>
            <h2>Nenhum pedido aberto no momento</h2>
            <p>Assim que um cliente solicitar um serviço, ele aparece aqui automaticamente.</p>
        </div>
    </main>

    <!-- Modelo de card (clonado pelo JS para cada pedido) -->
    <template id="modelo-card-pedido">
        <article class="card-pedido">
            <div class="card-topo">
                <span class="avatar-categoria"></span>
                <div class="card-titulo">
                    <span class="badge-categoria"></span>
                    <span class="card-tempo"></span>
                </div>
                <span class="badge-status status-aberto">Aberto</span>
            </div>

            <p class="card-cliente"></p>

            <p class="card-descricao"></p>

            <p class="card-endereco">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
                <span class="texto-endereco"></span>
            </p>

            <button type="button" class="btn-aceitar">Aceitar Serviço</button>
        </article>
    </template>

    <!-- 1. Importa a biblioteca do Supabase oficial da internet -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 2. Conecta as suas chaves do banco de dados -->
    <script src="js/supabase-config.js"></script>

    <!-- 3. Roda a lógica exclusiva do profissional -->
    <script src="js/profissional.js"></script>

</body>
</html>
