<!--
  TELA: Painel Inicial do Cliente (home-cliente.html)
  OBJETIVO: Apresentar as categorias de serviços disponíveis.
  O QUE FAZER AQUI:
  - Exibir saudação com o nome do cliente logado.
  - Botões/Cards clicáveis para as categorias (Encanador, Eletricista, Chaveiro).
  - Cada botão redireciona para 'solicitar-pedido.html?categoria=NOME'.
  - Importar no final: Supabase CDN, js/supabase-config.js e js/cliente.js.
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpMe - Início</title>

    <!-- Conectando as folhas de estilo (CSS) -->
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body class="painel">

    <!-- Barra lateral de navegação -->
    <aside class="sidebar">
        <a href="home-cliente.html" class="sidebar-logo">
            <span class="logo-icone">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
            </span>
            HelpMe
        </a>

        <nav class="sidebar-menu">
            <a href="home-cliente.html" class="menu-item ativo">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
                Início
            </a>
            <a href="servico-andamento.html" class="menu-item">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                Em andamento
            </a>
        </nav>

        <button type="button" id="btn-sair" class="menu-item menu-sair">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            Sair
        </button>
    </aside>

    <!-- Conteúdo principal -->
    <main class="conteudo">
        <header class="conteudo-cabecalho">
            <div>
                <h1>Olá, <span id="nome-cliente">cliente</span>!</h1>
                <p class="subtitulo">Qual serviço você precisa hoje?</p>
            </div>
        </header>

        <!-- Aviso de pedido ativo (preenchido pelo js/cliente.js) -->
        <section id="aviso-pedido" class="aviso-pedido" hidden>
            <div class="aviso-pedido-icone">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            </div>
            <div class="aviso-pedido-texto">
                <p class="aviso-pedido-titulo">
                    Você tem um pedido de <strong id="aviso-categoria"></strong>
                    <span id="aviso-status" class="badge-status"></span>
                </p>
                <p id="aviso-descricao" class="subtitulo"></p>
            </div>
            <a id="aviso-link" href="espera-cliente.html" class="btn-secundario">Acompanhar pedido</a>
        </section>

        <!-- Busca de categorias -->
        <div class="barra-busca">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="search" id="busca-categoria" placeholder="Buscar serviço (ex: encanador, pintor...)" aria-label="Buscar serviço">
        </div>

        <!-- Os cards de categorias são inseridos aqui pelo js/cliente.js -->
        <section id="lista-categorias" class="grade-categorias"></section>

        <!-- Estado vazio (aparece quando a busca não encontra nada) -->
        <div id="categorias-vazio" class="feed-vazio" hidden>
            <div class="feed-vazio-icone">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            </div>
            <h2>Nenhum serviço encontrado</h2>
            <p>Tente buscar por outro nome, como "eletricista" ou "chaveiro".</p>
        </div>
    </main>

    <!-- Modelo de card (clonado pelo JS para cada categoria) -->
    <template id="modelo-card-categoria">
        <a class="card-categoria">
            <span class="avatar-categoria"></span>
            <div>
                <h2 class="card-categoria-nome"></h2>
                <p class="card-categoria-descricao"></p>
            </div>
            <span class="btn-solicitar">Solicitar serviço</span>
        </a>
    </template>

    <!-- 1. Importa a biblioteca do Supabase oficial da internet -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 2. Conecta as suas chaves do banco de dados -->
    <script src="js/supabase-config.js"></script>

    <!-- 3. Roda a lógica exclusiva do cliente -->
    <script src="js/cliente.js"></script>

</body>
</html>
